name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never paste API keys. The log is in Setup › Log (or `Data/app.log`).
  - type: input
    id: version
    attributes:
      label: Program version
      description: Shown at the bottom right of the window and in Setup.
      placeholder: "e.g. 6.23"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: input
    id: services
    attributes:
      label: Services used
      placeholder: "Groq / local model small / Deepgram / ..."
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: Setup › Log › Problems only. Remove anything private.
      render: text
