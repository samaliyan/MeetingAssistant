name: Screen area check

# A real check on a real Windows machine of 'Read my screen' areas (6.36): the picture of a rectangle, the darkened
# screen where a box is drawn with the mouse, cancelling, hiding from screen sharing, and the whole job with a fake
# AI service. Pictures of each step are kept. It does not decide whether a release may go out.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "tests/win_area_check.py"
      - ".github/workflows/area-check.yml"

permissions:
  contents: read

jobs:
  area:
    name: Screen areas on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Unit tests on Windows (the end of the output is shown as a note on the run)
        env:
          PYTHONUTF8: "1"
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q -rf --tb=short tests > pytest-out.txt 2>&1; code=$?
          python - <<'PY'
          t = open("pytest-out.txt", encoding="utf-8", errors="replace").read()
          tail = t[-60000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::notice title=pytest on Windows::" + tail)
          PY
          exit $code

      - name: Draw areas and read them
        if: always()
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/win_area_check.py area-shots | Tee-Object -FilePath area-report.txt
          $code = $LASTEXITCODE
          $t = (Get-Content area-report.txt -Raw) -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
          Write-Output "::notice title=area check::$t"
          if ($code -ne 0) { exit 1 }

      - name: Small pictures as notes on the run (for a look without downloading)
        if: always()
        run: python tests/win_area_check.py --notes area-shots

      - name: Keep the report and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area-check
          path: |
            area-report.txt
            area-shots/
          if-no-files-found: ignore
          retention-days: 14
