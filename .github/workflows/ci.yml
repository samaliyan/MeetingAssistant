name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test requirements
        run: python -m pip install --quiet -r requirements-test.txt

      - name: Compile check
        run: python -m py_compile app.py tools/build.py

      - name: Run tests
        run: python -m pytest -q tests

  build:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pyinstaller
          python -m pip install --quiet "ctranslate2>=4.4" "tokenizers>=0.15" tqdm
          python -m pip install --quiet --no-deps "faster-whisper>=1.1"
          python -m pip install --quiet --prefer-binary --only-binary=llama-cpp-python "llama-cpp-python>=0.3.19" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || echo "::warning::llama-cpp-python not installed - the exe is built without the local AI engine"

      - name: Build
        run: python tools/build.py

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: MeetingAssistant-${{ github.sha }}-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: dist/MeetingAssistant.exe
