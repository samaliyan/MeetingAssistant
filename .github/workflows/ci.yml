name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test requirements
        run: python -m pip install --quiet -r requirements-test.txt

      - name: Compile check
        run: python -m py_compile app.py tools/build.py

      - name: Run tests
        run: python -m pytest -q tests

  build:
    name: Build Windows exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pyinstaller
          python -m pip install --quiet "ctranslate2>=4.6.3,<5" "tokenizers>=0.15" tqdm
          python -m pip install --quiet --no-deps "faster-whisper>=1.1"
          python -m pip install --quiet --prefer-binary --only-binary=llama-cpp-python "llama-cpp-python>=0.3.19" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || echo "::warning::llama-cpp-python not installed - the exe is built without the local AI engine"
          # an engine that installed but does not import is removed, so a broken one is never packed
          python -c "import sys,types;sys.modules.setdefault('av',types.ModuleType('av'));import faster_whisper,ctranslate2" || { echo "::warning::local speech engine does not import - left out"; python -m pip uninstall -y -q faster-whisper ctranslate2; }
          python -c "import llama_cpp" || { echo "::warning::local AI engine does not import - left out"; python -m pip uninstall -y -q llama-cpp-python; }
          python -m pip install --quiet "pywebview>=5,<7" || echo "::warning::pywebview not installed - the exe is built without the hidden window"
          python -c "import webview" || { echo "::warning::pywebview does not import - left out"; python -m pip uninstall -y -q pywebview; }
          python -m pip install --quiet "onnxruntime>=1.17,<2" || echo "::warning::onnxruntime not installed - no fast file mode, no speaker separation"
          python -c "import onnxruntime" || { echo "::warning::onnxruntime does not import - left out"; python -m pip uninstall -y -q onnxruntime; }
          python -m pip install --quiet "yt-dlp[default]>=2025.11.12" || echo "::warning::yt-dlp not installed - links cannot be transcribed"
          python -c "import yt_dlp" || { echo "::warning::yt-dlp does not import - left out"; python -m pip uninstall -y -q yt-dlp; }

      - name: Install the Vulkan SDK (to build whisper.cpp for any graphics card)
        continue-on-error: true
        shell: pwsh
        run: |
          $ver = '1.4.313.2'
          curl.exe -f -o "$env:RUNNER_TEMP/VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan-sdk.exe"
          & "$env:RUNNER_TEMP/VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\bin"

      - name: Build whisper.cpp (Vulkan)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.8.6 https://github.com/ggml-org/whisper.cpp.git wcpp
          cmake -S wcpp -B wcpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_VULKAN=1 -DGGML_NATIVE=OFF \
            -DWHISPER_BUILD_TESTS=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build wcpp/build -j --config Release --target whisper-server
          mkdir -p whisper_cpp
          cp wcpp/build/bin/Release/whisper-server.exe whisper_cpp/
          # the Vulkan loader goes next to it: on a PC without a Vulkan driver the engine still starts (on the processor)
          sdk="${VULKAN_SDK:-}"; [ -n "$sdk" ] && sdk="$(cygpath -u "$sdk")/Bin"
          for d in $sdk /c/Windows/System32; do
            if [ -f "$d/vulkan-1.dll" ]; then cp "$d/vulkan-1.dll" whisper_cpp/; break; fi
          done
          ./whisper_cpp/whisper-server.exe --help > /dev/null 2>&1 && echo "whisper-server starts" || echo "::warning::whisper-server.exe does not start on the build machine"
          ls -la whisper_cpp

      - name: Get quickjs (YouTube links need a JavaScript program)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p jsrt
          curl -fsSL -o jsrt/qjs.exe https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-windows-x86_64.exe
          ./jsrt/qjs.exe -e "print('quickjs ok')"

      - name: Build
        run: python tools/build.py

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: MeetingAssistant-${{ github.sha }}-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: dist/MeetingAssistant.exe

  startup:
    name: Startup on Windows
    # starts the new exe and the last release on a real Windows machine: how fast the program and its window
    # are up, the overlay, and a clean quit when the window is closed. Fails only when the new exe is broken.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: WebView2 runtime (the window that can hide from screen sharing)
        continue-on-error: true
        run: choco install webview2-runtime -y --no-progress

      - name: Get the new exe
        uses: actions/download-artifact@v4
        with:
          name: MeetingAssistant-${{ github.sha }}-Windows-x64
          path: new

      - name: Get the last release (to compare)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo ${{ github.repository }} --pattern MeetingAssistant.exe --dir old

      - name: Start them and measure
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/win_startup_check.py new/MeetingAssistant.exe old/MeetingAssistant.exe | Tee-Object -FilePath startup-report.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-report
          path: startup-report.txt
          if-no-files-found: ignore
          retention-days: 14

  voice:
    name: Voice on Windows (exe)
    # "Learn my voice" in the new exe: downloads the voice model, learns a voice (Windows' own speech voices read
    # into WAV files, as the runner has no microphone), and tells that voice from another one.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get the new exe
        uses: actions/download-artifact@v4
        with:
          name: MeetingAssistant-${{ github.sha }}-Windows-x64
          path: new

      - name: Learn a voice and tell it apart
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/win_voice_check.py new/MeetingAssistant.exe voice-out | Tee-Object -FilePath voice-report.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }

  overlay:
    name: Overlay on Windows (exe)
    # the new exe's overlay as a user sees it: real keys (Ctrl+Alt+O / PageUp / T), flags, the main window minimized
    # and back, and what the overlay shows inside (before a meeting, a line, a question with its answer, subtitles),
    # with "hide from screen sharing" on and off. Fails when the overlay does not open or shows nothing.
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test tools (pictures, looking inside the web view)
        run: python -m pip install --quiet pillow playwright

      - name: WebView2 runtime
        continue-on-error: true
        run: choco install webview2-runtime -y --no-progress

      - name: Get the new exe
        uses: actions/download-artifact@v4
        with:
          name: MeetingAssistant-${{ github.sha }}-Windows-x64
          path: new

      - name: Use the overlay
        env:
          PYTHONUTF8: "1"
        run: |
          python tests/win_overlay_exe_check.py new/MeetingAssistant.exe overlay-shots | Tee-Object -FilePath overlay-exe-report.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
