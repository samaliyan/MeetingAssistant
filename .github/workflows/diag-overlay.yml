name: Diag overlay (temporary)

# Temporary: runs the released exe's overlay on Windows and commits the pictures to this branch for review.
on:
  push:
    branches: ["diag/overlay"]
    paths-ignore: ["diag-shots/**"]

permissions:
  contents: write
  actions: read

jobs:
  overlay:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pillow
        run: python -m pip install --quiet pillow playwright
      - name: WebView2 runtime
        continue-on-error: true
        run: choco install webview2-runtime -y --no-progress
      - name: Which build to test
        id: rid
        shell: bash
        run: echo "run=$(cat diag-run-id.txt)" >> "$GITHUB_OUTPUT"; echo "name=$(cat diag-artifact.txt)" >> "$GITHUB_OUTPUT"
      - name: Get the exe to test (built by that CI run)
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.rid.outputs.name }}
          run-id: ${{ steps.rid.outputs.run }}
          github-token: ${{ github.token }}
          path: exe
      - name: Overlay check
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          MA_CHECK_C: "1"
        run: |
          python tests/win_overlay_exe_check.py exe/MeetingAssistant.exe diag-shots
      - name: Keep the pictures on this branch
        if: always()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          rm -rf diag-shots-keep; git add -f diag-shots
          git commit -q -m "diag shots [skip ci]" || exit 0
          git push -q origin HEAD:diag/overlay
