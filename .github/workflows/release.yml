name: Release

# A commit on main whose message contains [release] builds the exe and publishes a GitHub Release
# named after VERSION in app.py (for example v5.9).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"          # release notes and logs are written as UTF-8 on Windows too
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        shell: bash
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pyinstaller pytest
          python -m pip install --quiet "ctranslate2>=4.4" "tokenizers>=0.15" tqdm
          python -m pip install --quiet --no-deps "faster-whisper>=1.1"
          python -m pip install --quiet --prefer-binary --only-binary=llama-cpp-python "llama-cpp-python>=0.3.19" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu || echo "::warning::llama-cpp-python not installed - the exe is built without the local AI engine"
          # an engine that installed but does not import is removed, so a broken one is never packed
          python -c "import sys,types;sys.modules.setdefault('av',types.ModuleType('av'));import faster_whisper,ctranslate2" || { echo "::warning::local speech engine does not import - left out"; python -m pip uninstall -y -q faster-whisper ctranslate2; }
          python -c "import llama_cpp" || { echo "::warning::local AI engine does not import - left out"; python -m pip uninstall -y -q llama-cpp-python; }
          python -m pip install --quiet "pywebview>=5,<7" || echo "::warning::pywebview not installed - the exe is built without the hidden window"
          python -c "import webview" || { echo "::warning::pywebview does not import - left out"; python -m pip uninstall -y -q pywebview; }

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build the exe
        run: python tools/build.py

      - name: Check that the release has both local engines
        shell: bash
        run: |
          python -c "import sys,types;sys.modules.setdefault('av',types.ModuleType('av'));import faster_whisper" || echo "::warning::This release has no local speech-to-text engine"
          python -c "import llama_cpp" || echo "::warning::This release has no local AI engine"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c "import re;print(re.search(r'^VERSION = \"([^\"]+)\"', open('app.py', encoding='utf-8').read(), re.M).group(1))")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python tools/release_notes.py "$VERSION" > release_notes.md      # fails here (before any tag) if missing
          mkdir -p "pkg/MeetingAssistant"
          cp dist/MeetingAssistant.exe README.md README_FA.md Guide-EN.md Guide-FA.md LICENSE "pkg/MeetingAssistant/"
          (cd pkg && 7z a -tzip "../dist/MeetingAssistant-${VERSION}-Windows-x64.zip" MeetingAssistant >/dev/null)
          (cd dist && sha256sum MeetingAssistant.exe "MeetingAssistant-${VERSION}-Windows-x64.zip" > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "$TAG^{tree}")" != "$(git rev-parse "HEAD^{tree}")" ]; then
              echo "::error::Tag $TAG already points to different source. Raise VERSION in app.py before publishing."
              exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists for this exact source; nothing to do."
              exit 0
            fi
          else
            git tag -a "$TAG" -m "Meeting Assistant $VERSION"
            git push origin "$TAG"
          fi
          gh release create "$TAG" \
            "dist/MeetingAssistant.exe" \
            "dist/MeetingAssistant-${VERSION}-Windows-x64.zip" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --title "Meeting Assistant ${VERSION}" \
            --notes-file release_notes.md
